# Konfigurasi OpenTelemetry Collector (Milestone 2, Bonus Observability - B)
# Menerima trace dan log lewat OTLP (gRPC :4317 & HTTP :4318), lalu meneruskan:
# - traces -> Grafana Tempo (OTLP)
# - logs   -> Grafana Loki (OTLP HTTP) dengan label kardinalitas rendah (service.name, severity)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
