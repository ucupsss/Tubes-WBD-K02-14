# Prometheus mengambil /metrics dari server dan worker yang berjalan di host (go run / make run, make worker).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dbmp-server
    static_configs:
      - targets: ["host.docker.internal:9101"]
  - job_name: dbmp-worker
    static_configs:
      - targets: ["host.docker.internal:9102"]
