{{ define "content" }}
<article class="error-page">
  <header>
    <p class="error-code">{{ .Data.Status }}</p>
    <h1>{{ .Data.Label }}</h1>
  </header>
  <p><strong>{{ .Data.Message }}</strong></p>
  {{ with .Data.Hint }}<p class="error-hint">{{ . }}</p>{{ end }}
  <a href="/" role="button" class="secondary">Kembali ke Dashboard</a>
</article>
{{ end }}
