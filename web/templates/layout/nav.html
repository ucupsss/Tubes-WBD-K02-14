{{ define "nav" }}
<nav class="container">
  <ul>
    <li><a href="/"><strong>Tubes WBD</strong></a></li>
  </ul>
  <ul>
    {{ if .Principal }}
    {{ if .Principal.IsAdmin }}
    <li><a href="/admin/users">User</a></li>
    <li><a href="/admin/groups">Group</a></li>
    <li><a href="/admin/databases">Koneksi Database</a></li>
    {{ end }}
    <li>{{ .Principal.Username }}</li>
    <li>
      <form method="post" action="/logout">
        <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">
        <button type="submit" class="secondary outline">Keluar</button>
      </form>
    </li>
    {{ else }}
    <li><a href="/login">Masuk</a></li>
    {{ end }}
  </ul>
</nav>
{{ end }}
