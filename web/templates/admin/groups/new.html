{{ define "content" }}
<h1>Tambah Group</h1>

<form method="post" action="/admin/groups">
  <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">

  <label for="name">Nama Group</label>
  <input id="name" name="name" value="{{ .Data.Input.Name }}" maxlength="64" required>
  {{ with .Data.Errors.name }}<small class="field-error">{{ . }}</small>{{ end }}

  <label for="description">Deskripsi</label>
  <textarea id="description" name="description" maxlength="500">{{ .Data.Input.Description }}</textarea>
  {{ with .Data.Errors.description }}<small class="field-error">{{ . }}</small>{{ end }}

  <div class="form-actions">
    <button type="submit">Simpan Group</button>
    <a href="/admin/groups" role="button" class="secondary">Batal</a>
  </div>
</form>
{{ end }}
