{{ define "content" }}
<div class="page-header">
  <h1>Daftar Group</h1>
  <a href="/admin/groups/new" role="button" class="btn-primary">+ Tambah Group</a>
</div>

<table>
  <thead>
    <tr>
      <th>Nama</th>
      <th>Deskripsi</th>
      <th>Anggota</th>
      <th>Aksi</th>
    </tr>
  </thead>
  <tbody>
    {{ range .Data.Groups }}
    <tr>
      <td><strong>{{ .Name }}</strong></td>
      <td>{{ .Description }}</td>
      <td>{{ .MemberCount }}</td>
      <td>
        <div class="table-actions">
          <a href="/admin/groups/{{ .ID }}" role="button" class="secondary">Kelola</a>
          <a href="/admin/groups/{{ .ID }}/access" role="button" class="secondary outline">Akses Database</a>
        </div>
      </td>
    </tr>
    {{ else }}
    <tr>
      <td colspan="4">Belum ada group.</td>
    </tr>
    {{ end }}
  </tbody>
</table>
{{ end }}
