{{ define "content" }}
<h1>Migration Baru</h1>
<form method="post" action="/db/{{ .Data.DatabaseID }}/migrations">
  <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">

  <label for="title">Judul</label>
  <input id="title" name="title" value="{{ .Data.Input.Title }}" {{ with .Data.Errors.title }}aria-invalid="true"{{ end }}>
  {{ with .Data.Errors.title }}<small class="field-error">{{ . }}</small>{{ end }}

  <label for="sql_text">SQL</label>
  <textarea id="sql_text" name="sql_text" rows="12">{{ .Data.Input.SQLText }}</textarea>
  {{ with .Data.Errors.sql_text }}<small class="field-error">{{ . }}</small>{{ end }}

  <div class="migration-actions">
    <button type="submit">Simpan</button>
    <a href="/db/{{ .Data.DatabaseID }}/migrations" role="button" class="secondary">Batal</a>
  </div>
</form>
{{ end }}
